name: Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - filemanager-plus

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Android packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018"

          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Dependencias
        working-directory: app
        run: npm ci

      - name: Crear proyecto Android
        working-directory: app
        env:
          CI: true
        run: npm run tauri -- android init --ci

      - name: Compilar APK
        working-directory: app
        env:
          CI: true
        run: npm run tauri -- android build --debug --target aarch64 --apk true --ci

      - name: Buscar APK
        run: |
          find app/src-tauri/gen/android/app/build/outputs \
            -type f -name "*.apk" -print

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-Drive-FileManagerPlus-APK
          path: app/src-tauri/gen/android/app/build/outputs/**/*.apk
          if-no-files-found: error
